<!DOCTYPE html>
<html>
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta charset="utf-8">
<title>Настройки</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="topbar">
  <h1>Настройки — 1С:ГРМ AutoBackup</h1>
  <div class="right">
    <button class="btn primary" id="btnSave" onclick="doSave()">Сохранить</button>
    <button class="btn" onclick="doClose()">Закрыть</button>
  </div>
</div>
<div class="tabs">
  <div class="tab active" id="tab0" onclick="showTab(0)">Настройки</div>
  <div class="tab" id="tab1" onclick="showTab(1)">Выбор приложений</div>
</div>
<div style="position:absolute; top:92px; bottom:52px; left:0; right:0; overflow-y:auto;">
  <div class="tabpage active" id="page0">
    <div class="card">
      <h2>Подключение</h2>
      <label class="fl">URL API</label>
      <input class="txt" id="url" type="text">
      <label class="fl">JWT токен</label>
      <input class="txt" id="jwt" type="text">
      <div class="muted" style="margin-top:8px;">Токен выдаётся в личном кабинете 1С:ГРМ (Partner API v2).</div>
    </div>
    <div class="card">
      <h2>Расписание</h2>
      <div class="duo">
        <div class="c left" style="width:40%;">
          <label class="fl">Режим</label>
          <select class="txt" id="mode" style="width:100%;">
            <option value="interval">Каждые N часов</option>
            <option value="daily">Ежедневно в указанное время</option>
          </select>
        </div>
        <div class="c left" style="width:24%;">
          <label class="fl">Интервал, часов</label>
          <span class="stepper">
            <button class="btn sbtn" onclick="stepNum('interval', -1, 1, 720)">−</button>
            <input class="txt" id="interval" type="text" value="6" onkeydown="return onlyDigits(event)" onkeyup="sanitizeNum(this)">
            <button class="btn sbtn" onclick="stepNum('interval', 1, 1, 720)">+</button>
          </span>
        </div>
        <div class="c" style="width:36%;">
          <label class="fl">Время</label>
          <span class="timebox">
            <select class="txt" id="hour"></select><span class="sep">:</span><select class="txt" id="minute"></select>
          </span>
        </div>
      </div>
      <label class="row" style="margin-top:10px;"><input type="checkbox" id="stopped"> <span class="nm">Обрабатывать и остановленные приложения</span></label>
    </div>
    <div class="card">
      <h2>Сервис</h2>
      <div class="duo">
        <div class="c left" style="width:68%;">
          <div class="muted" id="svcState">Состояние: —</div>
        </div>
        <div class="c" style="width:32%;">
          <button class="btn" id="btnService" onclick="toggleService()">Остановить сервис</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h2>Хранилище и журнал</h2>
      <label class="fl">Папка сохранения бэкапов</label>
      <div class="pathrow">
        <div class="pc"><input class="txt" id="path" type="text"></div>
        <div class="pc btncell"><button class="btn" style="margin-left:0;" onclick="pickPath()" title="Выбрать папку…">…</button></div>
      </div>
      <div class="duo" style="margin-top:4px;">
        <div class="c left" style="width:50%;">
          <label class="fl">Лимит бэкапов на приложение</label>
          <span class="stepper">
            <button class="btn sbtn" onclick="stepNum('limit', -1, 1, 1000)">−</button>
            <input class="txt" id="limit" type="text" value="7" onkeydown="return onlyDigits(event)" onkeyup="sanitizeNum(this)">
            <button class="btn sbtn" onclick="stepNum('limit', 1, 1, 1000)">+</button>
          </span>
        </div>
        <div class="c" style="width:50%;">
          <label class="fl">Уровень лога</label>
          <select class="txt" id="level" style="width:100%;">
            <option value="debug">debug</option>
            <option value="info">info</option>
            <option value="warn">warn</option>
            <option value="error">error</option>
          </select>
        </div>
      </div>
      <label class="row" style="margin-top:10px;"><input type="checkbox" id="autostart"> <span class="nm">Автозапуск при входе в Windows</span></label>
    </div>
    <div style="height:12px;"></div>
  </div>
  <div class="tabpage" id="page1">
    <div class="card">
      <h2>Выбор приложений</h2>
      <div style="margin-bottom:8px;">
        <input class="txt" id="search" style="width:300px; display:inline-block; vertical-align:middle;" type="text" placeholder="Поиск по клиенту или конфигурации…" onkeyup="applyFilter()">
        <button class="btn primary" style="vertical-align:middle;" onclick="loadApps(true)">Обновить из API</button>
        <button class="btn" style="vertical-align:middle;" onclick="checkAll(true)">Все</button>
        <button class="btn" style="vertical-align:middle;" onclick="checkAll(false)">Снять все</button>
        <span id="counter" class="muted" style="margin-left:10px; vertical-align:middle;"></span>
      </div>
      <div id="apps"><div class="muted">Загрузка списка приложений…</div></div>
    </div>
    <div style="height:12px;"></div>
  </div>
</div>
<div class="footer">
  <span id="status" class="muted">Готово</span>
  <div class="right"><span id="selectedInfo" class="muted"></span></div>
</div>
<div id="toast" class="toast"></div>
<script>
function readKey() {
  var m = /[?&]k=([^&]+)/.exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : '';
}
var KEY = readKey();

var checked = {};
var groups = [];
var appsLoaded = false;
var servicePaused = false;

function api(method, path, body, cb) {
  var x = new XMLHttpRequest();
  var sep = path.indexOf('?') >= 0 ? '&' : '?';
  x.open(method, path + sep + 'k=' + encodeURIComponent(KEY) + '&_=' + (new Date()).getTime(), true);
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function () {
    if (x.readyState !== 4) { return; }
    if (x.status >= 200 && x.status < 300) {
      var data = null;
      try { data = JSON.parse(x.responseText); } catch (e) { data = null; }
      cb(null, data);
    } else {
      cb(x.responseText || ('HTTP ' + x.status), null);
    }
  };
  x.send(body ? JSON.stringify(body) : null);
}

function $(id) { return document.getElementById(id); }
function val(id) { var e = $(id); return e ? e.value : ''; }

function toast(msg, isErr) {
  var t = $('toast');
  t.className = isErr ? 'toast err' : 'toast';
  t.innerHTML = '';
  t.appendChild(document.createTextNode(msg));
  t.style.display = 'block';
  setTimeout(function () { t.style.display = 'none'; }, 2200);
}

function showTab(i) {
  $('tab0').className = 'tab' + (i === 0 ? ' active' : '');
  $('tab1').className = 'tab' + (i === 1 ? ' active' : '');
  $('page0').className = 'tabpage' + (i === 0 ? ' active' : '');
  $('page1').className = 'tabpage' + (i === 1 ? ' active' : '');
}

function pad2(n) { return n < 10 ? '0' + n : '' + n; }

function fillTimeSelects() {
  var h = $('hour'), m = $('minute'), i, o;
  for (i = 0; i < 24; i++) {
    o = document.createElement('option'); o.value = i; o.text = pad2(i); h.appendChild(o);
  }
  for (i = 0; i < 60; i++) {
    o = document.createElement('option'); o.value = i; o.text = pad2(i); m.appendChild(o);
  }
}

function setTime(hhmm) {
  var parts = String(hhmm || '00:00').split(':');
  var h = parseInt(parts[0], 10); if (isNaN(h) || h < 0 || h > 23) { h = 0; }
  var m = parseInt(parts[1], 10); if (isNaN(m) || m < 0 || m > 59) { m = 0; }
  $('hour').value = h;
  $('minute').value = m;
}

function getTime() {
  return pad2(parseInt($('hour').value, 10) || 0) + ':' + pad2(parseInt($('minute').value, 10) || 0);
}

function stepNum(id, delta, min, max) {
  var el = $(id);
  var v = parseInt(el.value, 10);
  if (isNaN(v)) { v = min; }
  v = v + delta;
  if (v < min) { v = min; }
  if (v > max) { v = max; }
  el.value = v;
}

function onlyDigits(e) {
  var ev = e || window.event;
  var k = ev.which || ev.keyCode;
  if (k >= 48 && k <= 57) { return true; }
  if (k === 8 || k === 9 || k === 46 || k === 37 || k === 39) { return true; }
  return false;
}

function sanitizeNum(el) {
  var v = el.value.replace(/[^\d]/g, '');
  if (v !== el.value) { el.value = v; }
}

function pickPath() {
  $('status').innerHTML = 'Выбор папки…';
  api('POST', '/api/pickfolder', { page: 'settings' }, function (err, d) {
    if (err) { $('status').innerHTML = 'Ошибка выбора папки'; return; }
    if (d && d.ok && d.path) { $('path').value = d.path; $('status').innerHTML = 'Папка выбрана'; return; }
    if (d && d.canceled) { $('status').innerHTML = 'Выбор папки отменён'; return; }
    $('status').innerHTML = 'Ошибка выбора папки';
    if (d && d.error) { toast('Ошибка: ' + d.error, true); }
  });
}

function loadSettings() {
  api('GET', '/api/settings', null, function (err, d) {
    if (err || !d) { $('status').innerHTML = 'Ошибка загрузки настроек'; return; }
    $('url').value = (d.api && d.api.url) || '';
    $('jwt').value = (d.api && d.api.jwt) || '';
    $('mode').value = (d.schedule && d.schedule.mode === 'daily') ? 'daily' : 'interval';
    $('interval').value = (d.schedule && d.schedule.interval) || 6;
    setTime((d.schedule && d.schedule.start) || '00:00');
    $('path').value = (d.storage && d.storage.path) || '';
    $('limit').value = (d.storage && d.storage.limit) || 7;
    $('level').value = d.level || 'info';
    $('stopped').checked = !!d.includeStopped;
    $('autostart').checked = !!d.autostart;
    $('status').innerHTML = 'Настройки загружены';
  });
}

function loadApps(resetState) {
  $('apps').innerHTML = '<div class="muted">Загрузка списка приложений…</div>';
  api('GET', '/api/apps', null, function (err, d) {
    if (err || !d) {
      $('apps').innerHTML = '';
      $('apps').appendChild(document.createTextNode('Ошибка загрузки: ' + err));
      return;
    }
    groups = d.customers || [];
    appsLoaded = true;
    if (resetState) {
      checked = {};
      var i;
      for (i = 0; i < (d.initial || []).length; i++) { checked[d.initial[i]] = true; }
    }
    renderApps();
  });
}

function renderApps() {
  var host = $('apps');
  host.innerHTML = '';
  var g, a;
  for (g = 0; g < groups.length; g++) {
    var grp = groups[g];
    var head = document.createElement('div');
    head.className = 'ghead';
    head.appendChild(document.createTextNode(grp.name));
    var cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.appendChild(document.createTextNode('· приложений: ' + grp.apps.length));
    head.appendChild(cnt);
    host.appendChild(head);
    for (a = 0; a < grp.apps.length; a++) {
      var app = grp.apps[a];
      var row = document.createElement('label');
      row.className = 'row';
      row.setAttribute('data-name', (grp.name + ' ' + app.name + ' ' + app.status).toLowerCase());
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!checked[app.id];
      cb.setAttribute('data-id', app.id);
      cb.onchange = (function (id, box) {
        return function () { checked[id] = box.checked; updateCounter(); };
      })(app.id, cb);
      row.appendChild(cb);
      var nm = document.createElement('span');
      nm.className = 'nm';
      nm.appendChild(document.createTextNode(app.name));
      row.appendChild(nm);
      var pill = document.createElement('span');
      pill.className = 'pill ' + (app.status === 'running' ? 'run' : 'stop');
      pill.appendChild(document.createTextNode(app.status === 'running' ? 'работает' : 'остановлено'));
      row.appendChild(pill);
      host.appendChild(row);
    }
  }
  if (groups.length === 0) {
    host.innerHTML = '<div class="muted">Список пуст — нажмите «Обновить из API»</div>';
  }
  updateCounter();
}

function applyFilter() {
  var q = ($('search').value || '').toLowerCase();
  var rows = $('apps').getElementsByTagName('label');
  var i;
  for (i = 0; i < rows.length; i++) {
    var nm = rows[i].getAttribute('data-name') || '';
    rows[i].style.display = (q === '' || nm.indexOf(q) >= 0) ? 'block' : 'none';
  }
  var heads = $('apps').getElementsByTagName('div');
  for (i = 0; i < heads.length; i++) {
    var h = heads[i];
    if (h.className !== 'ghead') { continue; }
    var vis = false;
    var n = h.nextSibling;
    while (n && n.className === 'row') {
      if (n.style.display !== 'none') { vis = true; break; }
      n = n.nextSibling;
    }
    h.style.display = vis ? 'block' : 'none';
  }
}

function checkAll(on) {
  var rows = $('apps').getElementsByTagName('label');
  var i, cb;
  for (i = 0; i < rows.length; i++) {
    if (rows[i].style.display === 'none') { continue; }
    cb = rows[i].getElementsByTagName('input')[0];
    if (!cb) { continue; }
    cb.checked = on;
    checked[cb.getAttribute('data-id')] = on;
  }
  updateCounter();
}

function updateCounter() {
  var n = 0, k;
  for (k in checked) {
    if (checked.hasOwnProperty(k) && checked[k]) { n++; }
  }
  $('counter').innerHTML = 'Отмечено: ' + n;
  $('selectedInfo').innerHTML = 'Выбрано приложений: ' + n;
}

function doSave() {
  var ids = [], k;
  for (k in checked) {
    if (checked.hasOwnProperty(k) && checked[k]) { ids.push(k); }
  }
  if (appsLoaded && ids.length === 0) {
    $('status').innerHTML = 'Ошибка';
    toast('Ошибка: отметьте хотя бы одно приложение', true);
    return;
  }
  var req = {
    url: val('url'),
    jwt: val('jwt'),
    path: val('path'),
    limit: parseFloat(val('limit')) || 0,
    mode: val('mode'),
    interval: parseFloat(val('interval')) || 0,
    start: getTime(),
    includeStopped: $('stopped').checked,
    autostart: $('autostart').checked,
    level: val('level'),
    checked: ids,
    selectionKnown: appsLoaded
  };
  $('status').innerHTML = 'Сохранение…';
  api('POST', '/api/save', req, function (err, d) {
    if (err) { $('status').innerHTML = 'Ошибка'; toast('Ошибка: ' + err, true); return; }
    if (!d || !d.ok) { $('status').innerHTML = 'Ошибка'; toast('Ошибка: ' + ((d && d.error) || 'неизвестно'), true); return; }
    $('status').innerHTML = 'Сохранено';
    toast('Сохранено');
    if (d.autostartWarning) { toast('Автозапуск: ' + d.autostartWarning, true); }
    if (!appsLoaded) { loadApps(true); }
  });
}

function doClose() {
  api('POST', '/api/close', { page: 'settings' }, function () {});
}

function loadService() {
  api('GET', '/api/service', null, function (err, d) {
    if (err || !d) { return; }
    servicePaused = !!d.paused;
    $('svcState').innerHTML = servicePaused
      ? 'Состояние: остановлен (работа по расписанию приостановлена)'
      : 'Состояние: работает';
    $('btnService').innerHTML = servicePaused ? 'Запустить сервис' : 'Остановить сервис';
  });
}

function toggleService() {
  var action = servicePaused ? 'start' : 'stop';
  $('svcState').innerHTML = 'Состояние: применяю…';
  api('POST', '/api/service', { action: action }, function (err, d) {
    if (err) { toast('Ошибка: ' + err, true); loadService(); return; }
    loadService();
    toast((d && d.paused) ? 'Сервис остановлен' : 'Сервис запущен');
  });
}

fillTimeSelects();
loadService();
if (window.location.hash === '#apps') { showTab(1); } else { showTab(0); }
loadSettings();
loadApps(true);
</script>
</body>
</html>
